# Terraform owns the Worker, database, hostname and rate limit, so no routes here.
name = "modedock-telemetry"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

# Off so IP addresses never reach the logs.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "modedock-telemetry"
# From `terraform output modedock_telemetry_d1_id`.
database_id = "18a9f12b-a2dd-4bbd-b1c8-5c0bf2bdd149"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]
