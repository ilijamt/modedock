name: Homebrew

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ilijamt/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
      - name: Write the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG#v}
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "ModeDock-$version.dmg" --dir "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP/ModeDock-$version.dmg" | cut -d' ' -f1)
          mkdir -p Casks
          cat >Casks/modedock.rb <<EOF
          cask "modedock" do
            version "$version"
            sha256 "$sha"

            url "https://github.com/ilijamt/modedock/releases/download/v#{version}/ModeDock-#{version}.dmg"
            name "ModeDock"
            desc "Menu-bar controls for screens, brightness, profiles, Keep Awake and screenshots"
            homepage "https://modedock.app"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true
            depends_on macos: ">= :sonoma"

            app "ModeDock.app"

            zap trash: [
              "~/Library/Caches/com.matoski.modedock",
              "~/Library/HTTPStorages/com.matoski.modedock",
              "~/Library/Logs/ModeDock",
              "~/Library/Preferences/com.matoski.modedock.plist",
            ]
          end
          EOF
          git add Casks/modedock.rb
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -m "modedock $version"
          git push
