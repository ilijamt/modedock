name: Bug report
description: Something in ModeDock doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the menu
        2. Pick a profile
        3. ...
  - type: input
    id: version
    attributes:
      label: ModeDock version
      description: Settings → About.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Displays
      description: Built-in and external screens, and how they're connected (USB-C, HDMI, dock).
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Turn on "Write a debug log" in Settings, repeat the problem, then attach ~/Library/Logs/ModeDock/ModeDock.log.
